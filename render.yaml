# Render blueprint for the API. The React client is deployed separately on Vercel from client/.
#
# Secrets are declared with `sync: false`: Render prompts for them on first deploy and stores them
# on the service, so no credential ever lands in this file.
services:
  - type: web
    name: resumon-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    # Verifies Mongo is actually reachable, not just that the process is up.
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production

      # ASP.NET Core maps `__` to a config-section separator, so these override appsettings.json.
      - key: Mongo__ConnectionString
        sync: false
      - key: Jwt__Key
        sync: false
      - key: Gemini__ApiKey
        sync: false

      # The deployed Vercel origin. *.vercel.app preview URLs are allowed by default in code.
      - key: Client__AllowedOrigins__0
        sync: false
